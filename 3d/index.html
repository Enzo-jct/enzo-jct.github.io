<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enzo Jacinto — La plongée</title>
  <meta name="description" content="Portfolio d'Enzo Jacinto en 3D : une plongée, de la surface de l'océan jusqu'aux abysses, à travers ses projets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="world.css">
  <script src="../data/content.js"></script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <script src="world.js" type="module"></script>
</head>
<body>
  <div class="loader">
    <div class="load">
      <div class="load-line"><i id="loader-bar"></i></div>
      <div class="load-go">
        <button class="load-enter" id="enter" disabled>Plonger</button>
        <button class="load-mute" id="enter-mute" disabled>ou entrer sans le son</button>
      </div>
      <span class="label load-hint">Son immersif · casque conseillé</span>
    </div>
    <a class="label load-lite" href="../">Version lite</a>
  </div>

  <header class="bar">
    <a class="logo" href="#" data-k="0" aria-label="Retour au début">EJ</a>
    <span class="bar-name"><span data-bind="name"></span> — portfolio</span>
    <div class="bar-right">
      <div class="sound">
        <button class="sound-btn" id="sound" aria-pressed="false">Son <span aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
        <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume du site">
      </div>
      <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu <span aria-hidden="true">···</span></button>
      <nav class="menu" id="menu" hidden></nav>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Chapitres"></nav>

  <main class="world">
    <section class="panel" id="p-surface">
      <span class="label">Portfolio</span>
      <h1 data-bind="name"></h1>
      <p class="roles" id="roles"></p>
      <span class="label hint">Fais défiler pour plonger ↓</span>
    </section>

    <section class="panel" id="p-dive"><p class="caption" id="caption"></p></section>

    <section class="panel" id="p-work">
      <div class="filters" id="filters" role="group" aria-label="Trier les projets"></div>
      <span class="label" id="w-num"></span>
      <h2 id="w-title"></h2>
      <span class="label" id="w-meta"></span>
      <button class="pill" id="w-open">Voir le projet <span aria-hidden="true">↗</span></button>
    </section>

    <section class="panel" id="p-about">
      <span class="label">À propos</span>
      <h2 id="about-title"></h2>
      <p class="roles" id="about-roles"></p>
      <p class="about-text" data-bind="intro"></p>
      <ol id="s-list"></ol>
      <p class="about-code" id="code"></p>
      <span class="label" id="tools"></span>
    </section>

    <section class="panel" id="p-contact">
      <span class="label">Contact</span>
      <h2 id="contact-title"></h2>
      <p id="contact-text"></p>
      <a class="contact-mail" id="mail"></a>
      <ul class="socials" id="socials"></ul>
      <span class="label"><span id="copy"></span> · <a href="../">Version lite</a></span>
    </section>
  </main>

  <div class="track"></div>

  <dialog class="viewer" id="viewer">
    <button class="viewer-close" id="viewer-close" aria-label="Fermer">✕</button>
    <div id="viewer-body"></div>
  </dialog>
</body>
</html>
